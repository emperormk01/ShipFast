name = "shipfast"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

[vars]
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "shipfast-db"
database_id = "510f6126-d61f-41bd-bfaa-da7621a22ef7"

routes = [
  { pattern = "shipfast.auxlo.xyz", custom_domain = true }
]
